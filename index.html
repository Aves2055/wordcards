<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WordHub — English Knowledge & Vocabulary Platform</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <div class="nav-container">
    <div class="brand">
      <span class="brand-icon">📚</span>
      <span class="brand-title">WordHub</span>
    </div>
    <nav class="nav-links">
      <button id="nav-search" class="nav-btn active" onclick="setTab('search')">🔍 Search & Discover</button>

      <button id="nav-saved" class="nav-btn" onclick="setTab('saved')">📚 Saved Words (<span id="saved-count">0</span>)</button>
      <button id="nav-settings" class="nav-btn" onclick="setTab('settings')">⚙️ Settings</button>
    </nav>
  </div>
</header>

<main class="main-container">
  <!-- SEARCH & KNOWLEDGE BASE TAB -->
  <div id="tab-search" class="tab-content active">
    
    <!-- Hero Header -->
    <section class="hero-section">
      <h2 class="hero-title">Master the English Language</h2>
      <p class="hero-subtitle">Explore definitions, morphology, word families, visual networks, and inline translations in one clean space.</p>

      
      <div class="search-box-container">
        <div class="search-input-wrapper">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" placeholder="Search any word (e.g., ego, benevolent, empathy)..." onkeydown="if(event.key==='Enter')doSearch()">
          <button class="btn btn-primary" onclick="doSearch()">Search</button>
        </div>
      </div>
    </section>

    <!-- Search Results Dynamic Output -->
    <div id="searchResults" class="results-container"></div>
  </div>

  <!-- SAVED DICTIONARY TAB -->
  <div id="tab-saved" class="tab-content">
    <div class="card shadow-sm">
      <div class="card-header-row">
        <h3>📚 My Personal Knowledge Base</h3>
        <div class="card-actions">
          <input type="text" id="savedFilter" placeholder="Filter saved words..." oninput="renderSaved()" class="filter-input">
          <button class="btn btn-secondary" onclick="exportData()">⬇ Export JSON</button>
        </div>
      </div>
    </div>
    <div id="savedList" class="saved-grid"></div>
  </div>

  <!-- SETTINGS TAB -->
  <div id="tab-settings" class="tab-content">
    <div class="card shadow-sm">
      <h3 class="card-title">⚙️ Platform Preferences</h3>
      
      <div class="setting-group">
        <label for="langSelect" class="setting-label">Inline Translation Target Language</label>
        <select id="langSelect" onchange="updateSettings()" class="select-input">
          <option value="hi">Hindi (हिन्दी)</option>
          <option value="te">Telugu (తెలుగు)</option>
          <option value="es">Spanish (Español)</option>
          <option value="fr">French (Français)</option>
          <option value="de">German (Deutsch)</option>
        </select>
      </div>
      
      <div class="setting-group">
        <label class="checkbox-label">
          <input type="checkbox" id="showTrlToggle" checked onchange="updateSettings()">
          <span>Automatically show inline machine translations under definitions and examples</span>
        </label>
      </div>

      <div class="setting-group">
        <label class="setting-label">Theme Mode</label>
        <div class="theme-buttons">
          <button class="btn btn-outline" onclick="toggleTheme('light')">☀️ Light Mode</button>
          <button class="btn btn-outline" onclick="toggleTheme('dark')">🌙 Dark Mode</button>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="footer-container">
    <p>WordHub Knowledge Platform — Powered by Open APIs & Web Standards</p>
  </div>
</footer>

<script src="app.js"></script>
<script>
  if ("serviceWorker" in navigator && /^https?:/.test(location.protocol)) {
    addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
</script>
</body>
</html>
