  `<div class="card"><h3 style="margin-top:0">My sentences</h3>${sv?(sv.mine||[]).map((s,i)=>`<div class="def">“${esc(s)}” ${spk(s)}<button class="sm" data-a="dms" data-id="${sv.id}" data-i="${i}">✕</button></div>`).join("")+`<div class="row"><input id="ms" class="grow" placeholder="Write your own sentence with “${esc(w)}”…"><button class="sm pri" data-a="ms" data-id="${sv.id}">Add</button></div>`:`<p class="mute">Save “${esc(w)}” first (Word Search, then Save) to keep your own sentences here.</p>`}</div>`}
 return`<h2>Sentences</h2><div class="card"><div class="row" style="margin:0"><input id="sw" class="grow" placeholder="Type a word…" value="${esc(sw)}" autocapitalize="off" autocomplete="off"><button class="pri" data-a="gs">Get sentences</button></div><div class="row">${langs()}</div></div>`+b}
const fmtI=ms=>ms<36e5?Math.round(ms/6e4)+" min":ms<DAY?Math.round(ms/36e5)+" h":Math.round(ms/DAY)+" d";
function fsched(w,g){let b=w.box||0,m=w.miss||0,iv;if(g===0){b=0;m++;iv=6e5}else if(g===1)iv=Math.max(1,STEPS[b]*.6)*DAY;else if(g===2){b=Math.min(b+1,6);iv=Math.max(1,STEPS[b])*DAY;m=Math.max(0,m-1)}else{b=Math.min(b+2,6);iv=Math.max(2,STEPS[b])*DAY;m=Math.max(0,m-1)}return{b,m,iv}}
function startF(){const all=live().sort((a,b)=>(a.due||0)-(b.due||0)),d=all.filter(w=>(w.due||0)<=Date.now());if(!all.length){note="Save some words first.";render();return}F={list:(d.length?d:shuffle(all)).slice(0,20).map(w=>w.id),i:0,flip:false,extra:!d.length};render()}
function vFlash(){if(F.i>=F.list.length)return`<div class="card" style="text-align:center"><div class="big">Session complete 🎉</div><p class="mute">${F.list.length} cards reviewed.</p><div class="row"><button class="pri" data-a="fc">Another session</button><button data-a="fq">Done</button></div></div>`;
 const w=words.find(x=>x.id===F.list[F.i]);if(!w||w.deleted){F.i++;return vFlash()}
 return`<div class="mute">Card ${F.i+1} of ${F.list.length}${F.extra?" · nothing was due, so this is extra practice":""}</div><div class="bar"><i style="width:${100*F.i/F.list.length}%"></i></div><div class="card" style="text-align:center"><div class="big">${esc(w.word)}</div>${spk(w.word)}<div class="mute">${esc(w.pron||"")}${w.roman?" · "+esc(w.roman):""}</div>${F.flip?`<div style="text-align:left;margin-top:12px">${w.meaning?`<div>${esc(w.meaning)}</div>${w.translations?"":T(w.meaning)}`:""}${(w.family||[]).filter(f=>f.w).slice(0,6).map(f=>`<div class="def"><b>${esc(f.w)}</b> <span class="tg">${esc(f.pos||"")}</span> ${esc(f.meaning||"")}</div>`).join("")}${w.translations?`<div class="trl" style="white-space:pre-wrap">${esc(w.translations)}</div>`:""}${w.note?`<div class="mute">📝 ${esc(w.note)}</div>`:""}</div>`:`<p class="mute">Recall the meaning and its family words, then flip.</p>`}</div>`+(F.flip?`<div class="row">${["Again","Hard","Good","Easy"].map((l,g)=>`<button class="${g===2?"pri":""}" data-a="fg" data-g="${g}" style="flex:1">${l}<br><small>${fmtI(fsched(w,g).iv)}</small></button>`).join("")}</div>`:`<div class="row"><button class="pri" data-a="ff" style="flex:1">Show answer</button></div>`)+`<button class="sm" data-a="fq" style="margin-top:10px">Quit</button>`}
/* events */
function dl(n,t){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"application/json"}));a.download=n;document.body.appendChild(a);a.click();a.remove()}
async function dlf(n,t){try{if(typeof claude!=="undefined"){const d=await claude.use("downloads");if(d){await d.save({filename:n,data:t});return}}}catch(e){}dl(n,t)}
function startQ(){const p=pool();if(p.length<(lvl>1?1:4)){note="Not enough saved words with meanings yet (need at least 4, or 1 for Advanced).";render();return}Q={i:0,sc:0,wr:[],sel:null,ok:false,ty:"",qs:shuffle(p).slice(0,10).map(it=>mkq(it,p))};render()}
function fin(ok){const c=Q.qs[Q.i];Q.ok=ok;if(ok)Q.sc++;else Q.wr.push(c.it);grade(c.it,ok)}
document.addEventListener("click",async e=>{const t=e.target.closest("[data-go],[data-lk],[data-a],[data-rel],[data-lang],[data-sm],[data-say],[data-aud],[data-o],[data-lvl],[data-qm],[data-fl],[data-op],[data-fav],[data-th],[data-vo],[data-ra]");if(!t)return;const D=t.dataset;
 if(D.aud)return aud(D.aud,D.say);if(D.say)return say(D.say);if(D.lk)return lookup(D.lk);if(D.go){tab=D.go;if(tab==="practice"){Q=null;F=null;note=""}return render(),scrollTo(0,0)}
 if(D.lang){cfg.lang=D.lang;SV("wc2c",cfg);return render()}if(D.sm){sm=D.sm;return render()}if(D.lvl){lvl=+D.lvl;return render()}if(D.qm){qmode=D.qm;return render()}if(D.fl){fl=D.fl;return render()}
 if(D.th){cfg.theme=D.th;SV("wc2c",cfg);theme();return render()}if(D.vo){cfg.voice=D.vo;SV("wc2c",cfg);return render()}if(D.ra){cfg.rate=D.ra;SV("wc2c",cfg);return render()}
 if(D.op){open.has(D.op)?open.delete(D.op):open.add(D.op);return render()}if(D.fav){e.stopPropagation();const w=words.find(x=>x.id===D.fav);if(w){w.fav=!w.fav;return put(w)}return}
 if(D.rel){const w=D.rel;if(RO.has(w))RO.delete(w);else{RO.add(w);if(!RC[w]){render();try{const a=await jget("https://api.dictionaryapi.dev/api/v2/entries/en/"+encodeURIComponent(w));RC[w]=pd(a)}catch(x){RC[w]="x"}}}return render()}
 if(D.o!==undefined){if(Q.sel!==null)return;const c=Q.qs[Q.i];Q.sel=+D.o;return fin(c.opts[Q.sel]===(c.ans||c.it)),render()}
 const a=D.a;
 if(a==="go"||a==="hs"){return lookup(a==="hs"?$("hq").value:$("sq").value)}
 else if(a==="gs")getSent($("sw").value);
 else if(a==="ps")getSent(D.w);
 else if(a==="cpt")cp(D.tx);
 else if(a==="ms"){const v=($("ms").value||"").trim(),w=words.find(x=>x.id===D.id);if(w&&v){w.mine=[...(w.mine||[]),v];put(w)}}
 else if(a==="dms"){const w=words.find(x=>x.id===D.id);if(w){w.mine=(w.mine||[]).filter((_,i)=>i!==+D.i);put(w)}}
 else if(a==="fc")startF();else if(a==="ff"){F.flip=true;render()}else if(a==="fq"){F=null;render()}
 else if(a==="fg"){const w=words.find(x=>x.id===F.list[F.i]);if(w){const r=fsched(w,+D.g);w.box=r.b;w.miss=r.m;w.due=Date.now()+r.iv}F.i++;F.flip=false;if(w)put(w);else render()}
 else if(a==="mic"){const S=window.SpeechRecognition||window.webkitSpeechRecognition;if(!S)return toast("Voice search is not supported in this browser");const r=new S();r.lang="en-US";r.onresult=ev=>lookup(ev.results[0][0].transcript.replace(/[.,!?]/g,""));r.onerror=()=>toast("Microphone unavailable or permission denied");try{r.start();toast("Listening…")}catch(x){toast("Could not start the microphone")}}
 else if(a==="sv"){put(toCard(P));toast("Saved ✓")}
 else if(a==="cpw")cp(prof2txt(P));
 else if(a==="bulkgo"){tab="search";sm="bulk";render()}
 else if(a==="bgo"){const l=[...new Set($("bq").value.split(/[,\n]+/).map(x=>x.trim().toLowerCase()).filter(Boolean))];if(!l.length)return;B={raw:l.join("\n"),items:l.map(w=>({w,s:"load"}))};render();bulkRun(l.map((_,i)=>i))}
 else if(a==="br")bulkRun([+D.i]);
 else if(a==="bs"){put(toCard(B.items[+D.i].L));toast("Saved ✓")}
 else if(a==="bc")cp(prof2txt(B.items[+D.i].L));
 else if(a==="bsall"){B.items.filter(x=>x.s==="ok").forEach(x=>put(toCard(x.L)));toast("Saved ✓")}
 else if(a==="bcall")cp(B.items.filter(x=>x.s==="ok").map(x=>prof2txt(x.L)).join("\n\n"));
 else if(a==="bex")dlf("bulk-results.json",JSON.stringify(B.items.filter(x=>x.s==="ok").map(x=>x.L),null,2));
 else if(a==="cps"){const w=words.find(x=>x.id===D.id);cp([w.word+" "+(w.pron||""),w.meaning||"",w.translations||"","Synonyms: "+(w.syn||""),"Antonyms: "+(w.ant||"")].join("\n"))}
 else if(a==="del"){if(confirm("Delete this word?"))put({id:D.id,deleted:true})}
 else if(a==="exp"){await dlf("my-word-cards.json",JSON.stringify(live(),null,2))}
 else if(a==="imp")$("imp").click();else if(a==="print")print();
 else if(a==="cpbk")cp(JSON.stringify(live()));
 else if(a==="rbk"){try{const l=JSON.parse($("rb").value.trim());if(!Array.isArray(l)||l.some(w=>!w.id||!w.word))throw 0;l.forEach(w=>w.u=Date.now());mergeIn(l);note="Restored "+l.length+" words (duplicates merged)."}catch(x){note="That text is not a valid backup."}render()}
 else if(a==="rev"){tab="practice";Q=null;startF()}
 else if(a==="qs")startQ();else if(a==="qq"){Q=null;render()}else if(a==="qn"){Q.i++;Q.sel=null;Q.ty="";render()}
 else if(a==="qc"||a==="qk"){const c=Q.qs[Q.i],v=a==="qc"?($("ta").value||"").trim():"";if(a==="qc"&&!v)return;Q.ty=a==="qk"?"(showed answer)":v;Q.sel=1;fin(a==="qc"&&v.toLowerCase()===c.it.w.toLowerCase());render()}
 else if(a==="mini")$("app").classList.toggle("mini")});
document.addEventListener("keydown",e=>{if(e.key!=="Enter")return;const i=e.target.id;if(i==="sw")getSent(e.target.value);else if(i==="sq"||i==="hq")lookup(e.target.value);else if(i==="ta"){const b=document.querySelector('[data-a="qc"]');b&&b.click()}});
document.addEventListener("input",e=>{const t=e.target;if(t.id==="fq"){sq2=t.value;render();const f=$("fq");f.focus();f.setSelectionRange(sq2.length,sq2.length)}else if(t.id==="sq")sq=t.value;else if(t.id==="sw")sw=t.value});
document.addEventListener("change",e=>{const t=e.target,w=words.find(x=>x.id===(t.dataset.note||t.dataset.col||t.dataset.trn));if(w&&t.dataset.note){w.note=t.value;put(w)}else if(w&&t.dataset.col){w.tags=t.value;put(w)}else if(w&&t.dataset.trn){w.translations=t.value;put(w)}});
const imp=document.createElement("input");imp.type="file";imp.id="imp";imp.accept=".json,application/json";imp.className="hide";document.body.appendChild(imp);
imp.addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;try{const l=JSON.parse(await f.text());if(!Array.isArray(l)||l.some(w=>!w.id||!w.word))throw 0;l.forEach(w=>w.u=Date.now());mergeIn(l);note="Imported "+l.length+" words (duplicates merged)."}catch(x){note="That file is not a valid backup."}e.target.value="";render()});
(async function(){theme();fixName();render();try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",theme)}catch(e){}
 if(typeof claude==="undefined")return;try{const u=await claude.use("user"),db=await claude.use("db");if(u&&db){store=db.collection("data/users/"+await u.id());store.onSnapshot(s=>{mergeIn(s.docs.map(d=>d.data()).filter(Boolean));fixName();render()},()=>{store=null})}}catch(e){}})();
</script><script>if("serviceWorker" in navigator&&/^https?:/.test(location.protocol)){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
