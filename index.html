<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1b33">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>WordHub — English Knowledge Platform</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app" id="app">
  <aside id="sb" class="sidebar">
    <div class="brand">
      <span class="brand-icon">📚</span>
      <span class="brand-title">WordHub</span>
    </div>
    <nav class="nav-links">
      <button class="nav-btn active" data-go="home">🏠 <span>Home</span></button>
      <button class="nav-btn" data-go="search">🔍 <span>Word Search</span></button>
      <button class="nav-btn" data-go="practice">🎯 <span>Practice Hub</span></button>
      <button class="nav-btn" data-go="learn">📖 <span>Grammar &amp; Learn</span></button>
      <button class="nav-btn" data-go="saved">📚 <span>Saved Deck</span></button>
      <button class="nav-btn" data-go="set">⚙️ <span>Settings</span></button>
    </nav>
  </aside>

  <main id="main" class="main-content">
    <!-- Dynamic Content Rendered Here -->
  </main>
</div>

<nav class="bottom-nav" id="bn"></nav>
<div id="toast" class="toast"></div>

<script src="app.js"></script>
<script>
  if ("serviceWorker" in navigator && /^https?:/.test(location.protocol)) {
    addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
</script>
</body>
</html>
